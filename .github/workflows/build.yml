name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0 (leave empty to build artifacts only)'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bundles: deb
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: macos-15-intel
            name: macos-x64
            bundles: dmg
          - os: macos-latest
            name: macos-arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\mingw64\bin'
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake bison flex
      - name: Configure macOS build tools
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test -- --watch=false
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: microchris-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg

  release:
    name: Publish installers
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: microchris-*
          path: installers
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --target "$RELEASE_COMMIT" --title "MicroChris $RELEASE_TAG" --notes "Desktop IDE for writing, building, and uploading assembly programs to Arduino boards."
          fi
          find installers -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' installer; do
              gh release upload "$RELEASE_TAG" "$installer" --repo "$RELEASE_REPOSITORY" --clobber
            done
