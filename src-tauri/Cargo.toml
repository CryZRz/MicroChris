[package]
name = "avr-studio-lite"
version = "0.1.3"
edition = "2021"
description = "Desktop IDE for writing, building, and uploading assembly programs to Arduino boards."
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
